<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes</title>
    <link rel="stylesheet" href='css/template.css' />
  </head>
  
  <div>
    <button id='home-button' onclick="location.href='https://iamwpj.com'"> 🏡 HOME </button>
    <button id='dark-button' onclick="darkMode()"> 🌓  </button>
    <br>
  </div>

  <body>
    <h2>Recipes:</h2>
    <div id='recipe-list'></div>
    <small>Find the details inside the <a href="https://github.com/iamwpj/iamwpj/tree/main/recipes">GitHub repository</a>.</small>
  </body>


  <script>
    function darkMode() {
        document.body.classList.toggle("dark-mode");
    }
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.body.classList.toggle("dark-mode");
    }

    function toTitleCase(str) {
      return str.replace(
        /\w\S*/g,
        text => text.charAt(0).toUpperCase() + text.substring(1).toLowerCase()
      );
    }

    async function getLatexHeader(url) {
      // Recipe descriptions are stored in the Latex header.
      try {
        const response = await fetch(url);
        const data = await response.text();
        const lines = data.split(/\r?\n|\r/);
        const result = lines
          .filter(line => line.startsWith('%'))
          .map(line => line.substring(1).trim());
     
        return result;
      } catch (error) {
        console.log('Failed to read file: ',error);
        return [];
      }
    }

    (async () => {
      const response = await fetch('https://api.github.com/repos/iamwpj/iamwpj/contents/recipes');
      const d = await response.json();
      const data = d.filter(x => x.name.includes('.pdf'));
      const names = data
        .map(x => x.name)
        .sort();
      
      let htmlString = '<ul>';
            
      for (let file of data) {
        let displayName = file.name
        // Adjust display name
        displayName = displayName.replaceAll("-"," ");
        displayName = displayName.replace(/\.[^/.]+$/, "");
        displayName = toTitleCase(displayName);

        // Get description
        let url = "https://raw.githubusercontent.com/iamwpj/iamwpj/refs/heads/main/recipes/source/"
          + file.name.replace(/\.[^/.]+$/, "") + ".tex";
        const details = await getLatexHeader(url);
        
        htmlString += '<li>';
        htmlString += `<a target="_blank" href="${file.name}">${displayName}</a>: <br>`;
        for (let detail of details) {
          htmlString += `<small>${detail}</small><br>`;
        }
        htmlString += '</p></li>';

      }
        htmlString += '</ul>';
        document.getElementById('recipe-list').innerHTML = htmlString;
      }
    )()
  </script>
</html>
